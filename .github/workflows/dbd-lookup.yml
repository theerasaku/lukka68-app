name: DBD Lookup

on:
  workflow_dispatch:
    inputs:
      query:
        description: "ชื่อบริษัท หรือ เลขทะเบียนนิติบุคคล 13 หลัก"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dbd-lookup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet requests playwright
          python -m playwright install --with-deps chromium

      - name: Fetch company data from DBD
        run: python dbd_fetch.py "${{ inputs.query }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbd-screenshots
          path: dbd_data/screenshots/
          if-no-files-found: ignore

      - name: Commit updated seed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dbd_data/seed.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Update DBD data: ${{ inputs.query }}"
            git push
          fi
